name: Publish npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      package_sha256: ${{ steps.release_artifact.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify release tag and main commit
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_SHA="$(git rev-parse HEAD)"

          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Release tag must point at current main."
            echo "tag:  $TAG_SHA"
            echo "main: $MAIN_SHA"
            exit 1
          fi

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run check

      - name: Coverage gate
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Package dry run
        run: npm run pack:check

      - name: Create verified release tarball
        id: release_artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact
          test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          TARBALL="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          TARBALL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          echo "sha256=$TARBALL_SHA256" >> "$GITHUB_OUTPUT"
          (
            cd release-artifact
            sha256sum -- *.tgz > SHA256SUMS
          )

      - name: Upload verified release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-package
          path: release-artifact/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require npm trusted-publishing support
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = version.split(".").map(Number);
          const supported =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!supported) {
            console.error(`npm ${version} is too old for trusted publishing; require >= 11.5.1.`);
            process.exit(1);
          }
          console.log(`npm ${version} supports trusted publishing.`);
          NODE

      - name: Download verified release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-package
          path: release-artifact

      - name: Verify release artifact integrity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          TARBALL="$(find . -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          ACTUAL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Downloaded release tarball SHA-256 does not match the verified build job output."
            echo "expected: $EXPECTED_SHA256"
            echo "actual:   $ACTUAL_SHA256"
            exit 1
          fi

      - name: Publish
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; nothing to do."
            exit 0
          fi

          TARBALL="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          npm publish "$TARBALL" --access public

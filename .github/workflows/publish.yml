name: Publish npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  # The coverage jobs look up ci.yml's coverage proof (.github/ci-proof.mjs) through the API.
  actions: read

# The whole suite under coverage no longer fits one job: 2.11.0's single-job coverage gate
# was still running when the 25-minute limit cancelled it (run 40636849817, 2026-10-28), so
# 2.11.0 never reached npm. Coverage now runs as four parallel shards, balanced as in ci.yml
# (test/helpers/weighted-shard-sequencer.ts), beside `verify`; `coverage gate` merges them and
# enforces the thresholds of vitest.config.ts on the whole suite. `publish` needs both: the
# package is published only from a tree that passed every gate, as before (#510).
jobs:
  verify:
    runs-on: ubuntu-latest
    # The ref checks, static gates, build, documentation, packed-consumer acceptance and the
    # release tarball; about 3 to 4 minutes without the coverage gate.
    timeout-minutes: 15
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      package_sha256: ${{ steps.release_artifact.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify protected release refs
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Release tag $GITHUB_REF_NAME is not protected by GitHub branch/tag protection or a ruleset."
            exit 1
          fi

          BRANCH_JSON="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main")"
          BRANCH_PROTECTED="$(printf '%s' "$BRANCH_JSON" | node -e '
            let data = "";
            process.stdin.on("data", (chunk) => { data += chunk; });
            process.stdin.on("end", () => {
              const branch = JSON.parse(data);
              process.stdout.write(branch.protected === true ? "true" : "false");
            });
          ')"

          if [ "$BRANCH_PROTECTED" != "true" ]; then
            echo "The main branch is not protected; refusing npm release."
            exit 1
          fi

      - name: Verify release tag and main commit
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_SHA="$(git rev-parse HEAD)"

          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Release tag must point at current main."
            echo "tag:  $TAG_SHA"
            echo "main: $MAIN_SHA"
            exit 1
          fi

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify static and policy gates
        run: npm run check:static

      - name: Build
        run: npm run build

      - name: Documentation and packed consumer acceptance
        run: |
          npm run docs:check
          npm run release:consumer-check

      - name: Package dry run
        run: npm run pack:check

      - name: Create verified release tarball
        id: release_artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact
          test "$(find release-artifact -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          TARBALL="$(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          TARBALL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          echo "sha256=$TARBALL_SHA256" >> "$GITHUB_OUTPUT"
          (
            cd release-artifact
            sha256sum -- *.tgz > SHA256SUMS
          )

      - name: Upload verified release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-package
          path: release-artifact/
          if-no-files-found: error
          retention-days: 1

  coverage-shard:
    # A quarter of the suite under V8 coverage on the release's Node.js line, kept as a Vitest
    # blob report; no shard checks thresholds on its own (vitest.config.ts). When ci.yml's
    # `verify (lts/*)` passed the whole suite under coverage on this exact tree and this exact
    # Node.js release (#510), the shard skips that repeat; any other case runs it.
    name: coverage shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # CI's shards took 7 to 13.5 minutes each before they were balanced by time.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      proven: ${{ steps.proof.outputs.found }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Coverage proof of the tagged tree
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-proof.mjs find coverage .github/workflows/ci.yml
      - name: Install
        if: steps.proof.outputs.found != 'true'
        run: npm ci --ignore-scripts
      - name: Tests with coverage, this quarter
        if: steps.proof.outputs.found != 'true'
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob --outputFile=.vitest-reports/blob-${{ matrix.shard }}-4.json
      - name: Keep the blob report for the merge
        if: steps.proof.outputs.found != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}-4.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    # The coverage gate: all four shards merged, thresholds enforced on the whole suite. A
    # skipped or failed shard fails it.
    name: coverage gate
    needs: coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install
        if: needs.coverage-shard.outputs.proven != 'true'
        run: npm ci --ignore-scripts
      - name: Download the four coverage parts
        if: needs.coverage-shard.outputs.proven != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .vitest-reports
      - name: Coverage gate (all four parts merged, thresholds enforced)
        if: needs.coverage-shard.outputs.proven != 'true'
        run: |
          test "$(find .vitest-reports -maxdepth 1 -name 'blob-*-4.json' | wc -l)" = "4"
          npx vitest --merge-reports .vitest-reports --coverage

  publish:
    needs: [verify, coverage]
    runs-on: ubuntu-latest
    # About 1 minute normally.
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require npm trusted-publishing support
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = version.split(".").map(Number);
          const supported =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!supported) {
            console.error(`npm ${version} is too old for trusted publishing; require >= 11.5.1.`);
            process.exit(1);
          }
          console.log(`npm ${version} supports trusted publishing.`);
          NODE

      - name: Download verified release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-package
          path: release-artifact

      - name: Verify release artifact integrity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          TARBALL="$(find . -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          ACTUAL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Downloaded release tarball SHA-256 does not match the verified build job output."
            echo "expected: $EXPECTED_SHA256"
            echo "actual:   $ACTUAL_SHA256"
            exit 1
          fi

      - name: Publish
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; nothing to do."
            exit 0
          fi

          TARBALL="$(find "$PWD/release-artifact" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          test -f "$TARBALL"
          npm publish "$TARBALL" --access public

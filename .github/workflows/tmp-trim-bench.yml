name: Temporary trim timing
# Temporary: CI-runner timing evidence for the internal scene evaluator PR; removed before merge.
on:
  pull_request:
    paths: [".github/workflows/tmp-trim-bench.yml", ".github/tmp-bench/**"]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
          path: base
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts && npm run build
      - run: cd base && npm ci --ignore-scripts && npm run build
      - name: Timings (alternating, three runs each)
        run: |
          nproc; lscpu | grep "Model name"; git -C base rev-parse HEAD
          for c in region preview; do for i in 1 2 3; do
            node .github/tmp-bench/trim.mjs dist/index.js head $c
            node .github/tmp-bench/trim.mjs base/dist/index.js main $c
          done; done

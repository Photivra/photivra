name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  # The test-once proofs (.github/ci-proof.mjs) are artifacts, looked up through the API.
  actions: read

concurrency:
  # A newer push to a pull request cancels that pull request's older run, which
  # would never be merged. Each push to main and each merge-queue entry has its own
  # group (its commit), so those runs are never cancelled or queued behind each other.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Test once per tree and runtime (photivra/photivra#510). Pull requests and merge-queue
# entries run the required set below. A job that passes every step uploads a proof named by
# the tree it tested, the job and its Node.js version (.github/ci-proof.mjs). A merge-queue
# entry or push to main whose tree already has that job's proof skips the job's work and
# reports success; any other tree, a different Node.js release or a failed lookup runs it in
# full. A pull request never skips on a proof. A docs-only change (.github/ci-scope.mjs)
# skips the test suite and the coverage run and keeps every other gate.
jobs:
  scope:
    name: change scope
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's test merge and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
      - name: Test the CI scope and proof rules
        run: node --test .github/test-ci-tools.mjs
      - name: Classify the change
        id: scope
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            git fetch --depth=1 --no-tags origin "$QUEUE_BASE"
            BASE="$QUEUE_BASE"
          else
            BASE="HEAD^1"
          fi
          node .github/ci-scope.mjs "$BASE" HEAD

  test:
    # The suite on every supported line, in two parts balanced by measured time
    # (test/helpers/weighted-shard-sequencer.ts), and the build with the packed-consumer
    # acceptance (the built tarball and its documented examples) as a third part.
    name: test (${{ matrix.node-version }}, ${{ matrix.part }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Supported lines move on their own: lts/* is the newest LTS, lts/-1
        # the one before it, node the newest Current. 22.13.0 is the
        # engines.node minimum; raise it when its line reaches end of life.
        # The policy guard below runs before install, so an alias that moves to
        # an unreviewed or end-of-life major fails instead of being adopted.
        # lts/* is the primary leg, the coverage shards and `verify-primary` below.
        node-version:
          - "22.13.0"
          - "lts/-1"
          - "node"
        part: ["1/2", "2/2", "package"]
    env:
      RUNS: ${{ matrix.part == 'package' || needs.scope.outputs.tests == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Proof of this tree
        id: proof
        if: github.event_name == 'merge_group' && env.RUNS == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-proof.mjs find "test-${{ matrix.part }}"
      - name: Install
        if: env.RUNS == 'true' && steps.proof.outputs.found != 'true'
        run: npm ci --ignore-scripts
      - name: Test suite, this part
        if: matrix.part != 'package' && env.RUNS == 'true' && steps.proof.outputs.found != 'true'
        run: npx vitest run --shard=${{ matrix.part }}
      - name: Build
        if: matrix.part == 'package' && steps.proof.outputs.found != 'true'
        run: npm run build
      - name: Packed consumer acceptance
        if: matrix.part == 'package' && steps.proof.outputs.found != 'true'
        run: npm run release:consumer-check
      # Benchmark and native profiling evidence runs in native-performance.yml
      # when its source paths change, nightly, and on manual dispatch.
      - name: Name the proof
        id: proof-name
        if: env.RUNS == 'true' && steps.proof.outputs.found != 'true'
        run: |
          node .github/ci-proof.mjs name "test-${{ matrix.part }}"
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-proof.txt"
      - name: Keep the proof
        if: steps.proof-name.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.proof-name.outputs.name }}
          path: ${{ runner.temp }}/ci-proof.txt
          retention-days: 7

  verify:
    # The required `verify (<line>)` checks. They run even when a part failed (a skipped
    # required check would count as passing) and pass only when all three parts of their own
    # line passed in this run attempt, read from the run's job list (GitHub reports one
    # `needs` result for the whole matrix, which would let one line's failure fail all three).
    name: verify (${{ matrix.node-version }})
    needs: test
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: ["22.13.0", "lts/-1", "node"]
    steps:
      - name: Require every part of this line to have passed
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ matrix.node-version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | [.name, .conclusion // "none"] | @tsv' > jobs.tsv
          PARTS="$(awk -F '\t' -v prefix="test ($LINE, " 'index($1, prefix) == 1' jobs.tsv)"
          printf '%s\n' "$PARTS"
          if [ "$(printf '%s\n' "$PARTS" | grep -c .)" != "3" ] || printf '%s\n' "$PARTS" | awk -F '\t' '$2 != "success"' | grep -q .; then
            echo "::error title=Tests::Not every test part of Node.js $LINE passed."
            exit 1
          fi

  coverage-shard:
    # The coverage run (the whole test suite under V8 coverage) split into four parallel
    # parts balanced by measured time (test/helpers/weighted-shard-sequencer.ts). Each part
    # runs every test of its share under coverage and keeps the raw coverage in a Vitest
    # blob report; no part checks the thresholds on its own (vitest.config.ts).
    # `verify (lts/*)` merges all four and enforces the thresholds once, on the whole suite.
    # Each part also keeps its per-file times, for scripts/record-shard-weights.mjs.
    name: coverage shard (${{ matrix.shard }}/4)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RUNS: ${{ needs.scope.outputs.tests == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Proof of this tree
        id: proof
        if: github.event_name == 'merge_group' && env.RUNS == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-proof.mjs find coverage
      - name: Install
        if: env.RUNS == 'true' && steps.proof.outputs.found != 'true'
        run: npm ci --ignore-scripts
      - name: Tests with coverage, this quarter
        if: env.RUNS == 'true' && steps.proof.outputs.found != 'true'
        run: >-
          npx vitest run --coverage --shard=${{ matrix.shard }}/4
          --reporter=blob --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}-4.json
          --reporter=json --outputFile.json=.vitest-timings/coverage-${{ matrix.shard }}-4.json
      - name: Keep the blob report for the merge
        if: env.RUNS == 'true' && steps.proof.outputs.found != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}-4.json
          if-no-files-found: error
          retention-days: 1
      - name: Keep the per-file times
        if: env.RUNS == 'true' && steps.proof.outputs.found != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-timings-${{ matrix.shard }}
          path: .vitest-timings/coverage-${{ matrix.shard }}-4.json
          if-no-files-found: error
          retention-days: 7

  verify-primary:
    # The required `verify (lts/*)` check. It runs even when a shard failed (a
    # skipped required check would count as passing) and then fails at once; it
    # merges the four coverage parts and enforces the coverage thresholds of
    # vitest.config.ts on the whole suite, and runs the static, documentation and
    # package gates on lts/*. Its proof is the `coverage` proof the shards and
    # `main smoke` look up.
    name: verify (lts/*)
    needs: [scope, coverage-shard]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTS: ${{ needs.scope.outputs.tests }}
    steps:
      - name: Require the scope and every coverage shard to have passed
        env:
          SCOPE: ${{ needs.scope.result }}
          SHARDS: ${{ needs.coverage-shard.result }}
        run: |
          if [ "$SCOPE" != "success" ] || [ "$SHARDS" != "success" ]; then
            echo "::error title=Coverage::The change scope ($SCOPE) or a coverage shard ($SHARDS) did not pass."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Proof of this tree
        id: proof
        if: github.event_name == 'merge_group' && env.TESTS == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-proof.mjs find coverage
      - name: Install
        if: steps.proof.outputs.found != 'true'
        run: npm ci --ignore-scripts
      - name: Verify static and policy gates
        if: steps.proof.outputs.found != 'true'
        run: npm run check:static
      - name: Download the four coverage parts
        if: env.TESTS == 'true' && steps.proof.outputs.found != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .vitest-reports
      - name: Coverage gate (all four parts merged, thresholds enforced)
        if: env.TESTS == 'true' && steps.proof.outputs.found != 'true'
        run: |
          test "$(find .vitest-reports -maxdepth 1 -name 'blob-*-4.json' | wc -l)" = "4"
          npx vitest --merge-reports .vitest-reports --coverage
      - name: Build
        if: steps.proof.outputs.found != 'true'
        run: npm run build
      - name: Generated documentation and navigation
        if: steps.proof.outputs.found != 'true'
        run: npm run docs:check
      - name: Packed consumer acceptance
        if: steps.proof.outputs.found != 'true'
        run: npm run release:consumer-check
      - name: Package dry run
        if: steps.proof.outputs.found != 'true'
        run: npm run pack:check
      - name: Name the proof
        id: proof-name
        if: env.TESTS == 'true' && steps.proof.outputs.found != 'true'
        run: |
          node .github/ci-proof.mjs name coverage
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-proof.txt"
      - name: Keep the proof
        if: steps.proof-name.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.proof-name.outputs.name }}
          path: ${{ runner.temp }}/ci-proof.txt
          retention-days: 7

  licence-scan:
    # Scans every file in the repository with ScanCode Toolkit (Apache-2.0,
    # free). The policy script fails on a non-Apache-2.0 licence finding or a
    # foreign copyright holder, unless the file and finding are on its
    # reviewed allowlist (scripts/check-scancode-policy.mjs). See
    # docs/DEVELOPERS.md, "Licence and copyright scan".
    name: licence scan
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Proof of this tree
        id: proof
        if: github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-proof.mjs find licence-scan
      - name: Use Python
        if: steps.proof.outputs.found != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ScanCode Toolkit
        if: steps.proof.outputs.found != 'true'
        # Complete hash-pinned set; --no-deps because the tested set pins
        # pluggy 0.13.1 below scancode-toolkit-mini's declared range.
        run: |
          python -m venv "$RUNNER_TEMP/scancode"
          "$RUNNER_TEMP/scancode/bin/python" -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/scancode-requirements.txt
          "$RUNNER_TEMP/scancode/bin/scancode" --version
      - name: Scan licences and copyrights
        if: steps.proof.outputs.found != 'true'
        # No npm install runs in this job, so node_modules, dist and coverage
        # do not exist; they are ignored anyway, as is .git. One scan process
        # per CPU (4 on the standard runner for public repositories): the same
        # files and the same per-file timeout. Measured in October 2026: 317 s
        # with 4 processes against 337 s with 2 (1036 files; no file over 17 s
        # of CPU time), so the runner's CPUs, not the process count, set the time.
        run: >-
          "$RUNNER_TEMP/scancode/bin/scancode"
          --license --copyright -n "$(nproc)" --strip-root --timeout 300
          --ignore ".git" --ignore "node_modules" --ignore "dist" --ignore "coverage"
          --json "$RUNNER_TEMP/scancode.json" .
      - name: Check licence and copyright policy
        if: steps.proof.outputs.found != 'true'
        run: node scripts/check-scancode-policy.mjs "$RUNNER_TEMP/scancode.json"
      - name: Name the proof
        id: proof-name
        if: steps.proof.outputs.found != 'true'
        run: |
          node .github/ci-proof.mjs name licence-scan
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-proof.txt"
      - name: Keep the proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.proof-name.outcome == 'success'
        with:
          name: ${{ steps.proof-name.outputs.name }}
          path: ${{ runner.temp }}/ci-proof.txt
          retention-days: 7

  hash-locks-macos:
    # Informational portability check for the bit-identity hash locks, which
    # were recorded on Linux x64 (docs/NUMERICAL_CORRECTNESS.md, "Test hash
    # locks and platforms"). It does not block the required verify gate; a
    # failure is a portability finding to investigate. GitHub-hosted macOS
    # minutes are free for this public repository. It is a required check, so it also
    # reports on merge-queue entries; there it skips on a proof of the same tree.
    name: hash locks (macos-latest)
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Proof of this tree
        id: proof
        if: github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-proof.mjs find hash-locks-macos
      - name: Install
        if: steps.proof.outputs.found != 'true'
        run: npm ci --ignore-scripts
      - name: Hash-lock tests
        if: steps.proof.outputs.found != 'true'
        run: >-
          npx vitest run
          test/native-environment-bit-identity.test.ts
          test/stabilization-evaluation-identity.test.ts
          test/canonical-json-identity.test.ts
          test/jpeg-reference-byte-parity.test.ts
          test/poc-projection-reuse.test.ts
      - name: Hash locks that differ on an Apple M5 Pro (photivra/photivra#508)
        # Informational until #508 is resolved: a failure here tells "macOS arm64" apart
        # from "one machine", and does not fail this job.
        if: steps.proof.outputs.found != 'true'
        continue-on-error: true
        run: >-
          npx vitest run
          test/display-view.test.ts
          test/display-view-pixel-memo.test.ts
          test/diffraction-psf-profile.test.ts
      - name: Name the proof
        id: proof-name
        if: steps.proof.outputs.found != 'true'
        run: |
          node .github/ci-proof.mjs name hash-locks-macos
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-proof.txt"
      - name: Keep the proof
        if: steps.proof-name.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.proof-name.outputs.name }}
          path: ${{ runner.temp }}/ci-proof.txt
          retention-days: 7

  main-smoke:
    # A push to main re-runs nothing already proved on the same tree. Its tree has the
    # merge queue's `coverage` proof when the queue tested this commit (the whole suite under
    # coverage, the build and the packed-consumer acceptance on lts/*), and then it does
    # nothing more. Otherwise it builds the merged commit and runs a quick subset: the
    # bit-identity hash-lock tests and the packed-consumer acceptance.
    name: main smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "lts/*"
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Proof of this tree
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-proof.mjs find coverage
      - name: Install
        if: steps.proof.outputs.found != 'true'
        run: npm ci --ignore-scripts
      - name: Build
        if: steps.proof.outputs.found != 'true'
        run: npm run build
      - name: Hash-lock tests
        if: steps.proof.outputs.found != 'true'
        run: >-
          npx vitest run
          test/native-environment-bit-identity.test.ts
          test/stabilization-evaluation-identity.test.ts
          test/canonical-json-identity.test.ts
          test/jpeg-reference-byte-parity.test.ts
          test/poc-projection-reuse.test.ts
      - name: Packed consumer acceptance
        if: steps.proof.outputs.found != 'true'
        run: npm run release:consumer-check

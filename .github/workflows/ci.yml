name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.13.0"
          - "22"
          - "24"
          - "26"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify Node.js support policy
        run: |
          node --test .github/test-node-lts-policy.mjs
          node .github/node-lts-policy.mjs
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify with ordinary tests
        if: matrix.node-version != '24'
        run: npm run check
      - name: Verify static and policy gates
        if: matrix.node-version == '24'
        run: npm run check:static
      - name: Coverage gate
        if: matrix.node-version == '24'
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Documentation and packed consumer acceptance
        run: |
          npm run docs:check
          npm run release:consumer-check

      - name: Package dry run
        run: npm run pack:check
      - name: Benchmark image formation
        if: matrix.node-version == '24'
        run: npm run bench:image-formation:built

      - name: Measure bounded native SDR execution
        if: matrix.node-version == '24'
        run: node --expose-gc scripts/benchmark-native-capture-sdr.mjs

      - name: Verify frozen full-native Path-A work obstruction without executing giant events
        if: matrix.node-version == '24'
        run: npm run assess:native-full-event

      - name: Profile browser-native reference path
        if: matrix.node-version == '24'
        run: npm run profile:native-reference

      - name: Qualify progressive browser-native complete events
        if: matrix.node-version == '24'
        run: npm run qualify:native-reference-progressive

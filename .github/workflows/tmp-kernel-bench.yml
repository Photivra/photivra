name: Temporary kernel timing
# Temporary: CI-runner timing evidence for the diffraction kernel reuse PR; removed before merge.
on:
  pull_request:
    paths: [".github/workflows/tmp-kernel-bench.yml", ".github/tmp-bench/**"]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts && npm run build
      - run: mkdir -p "$RUNNER_TEMP/base" && cd "$RUNNER_TEMP/base" && npm init -y >/dev/null && npm install --ignore-scripts @photivra/engine@2.5.0 >/dev/null
      - name: Timings
        run: |
          nproc; lscpu | grep "Model name"
          node .github/tmp-bench/kernels.mjs dist/index.js head
          node .github/tmp-bench/kernels.mjs "$RUNNER_TEMP/base/node_modules/@photivra/engine/dist/index.js" 2.5.0
